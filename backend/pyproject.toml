[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length ya cubierto por black/formato; evita duplicar ruido
    # Deuda heredada real, no ruido -- documentada aquí en vez de silenciada
    # sin registro. 11,716 de 11,920 violaciones originales ya se corrigieron
    # automáticamente (Sprint 0). Estas 11 categorías (203 ocurrencias,
    # concentradas en app/services/, app/routes/, scripts/, tests/) requieren
    # juicio caso por caso sobre código que Sprint 1 va a refactorizar hacia
    # core/* de todos modos -- se resuelven ahí, no se acumulan más aquí.
    "E722",  # bare-except (53) -- swallow silencioso, requiere decidir qué capturar
    "E402",  # import no al inicio del módulo (38) -- mayormente sys.path.insert previo a import
    "E741",  # nombre de variable ambiguo (11)
    "F401",  # import sin usar remanente tras el auto-fix (24)
    "F402",  # variable de loop sombrea import (5)
    "F811",  # redefinición sin usar (1)
    "F821",  # nombre indefinido (4) -- 1 es un forward-ref de tipo inofensivo;
             # los otros 3 (STATE_COMPANY/STATE_SALARY en telegram_bot.py) son
             # un bug real documentado para Sprint 1, no ignorado por descuido.
    "F601",  # clave repetida en literal (3)
    "B007",  # variable de loop sin usar (1)
    "B017",  # assertRaises(Exception) genérico en un test (1)
    "B904",  # raise sin `from` dentro de except (4)
]
# B008 (llamada en default arg): FastAPI usa Depends()/Query()/Body() como
# default idiomático -- no es code smell, es el patrón del framework.
extend-safe-fixes = ["UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Fase 0/Sprint 0: el codigo heredado (services/) no tiene tipado completo
# todavia. Se activa estricto por modulo a medida que Sprint 1 lo refactoriza
# hacia core/*, en vez de bloquear Foundation exigiendo tipado retroactivo
# de ~100 archivos heredados de una sola vez.
[[tool.mypy.overrides]]
module = "app.services.*"
ignore_errors = true

[[tool.mypy.overrides]]
# app/routes/*: 30 errores, mayoría falsos positivos de SQLModel/SQLAlchemy
# (.desc()/.asc()/.ilike() sobre columnas -- mypy ve el tipo Python declarado,
# no el InstrumentedAttribute real, sin el plugin de SQLAlchemy) más algunos
# Optional implícitos reales de baja severidad. Mismo criterio que
# app.services.*: se corrige al refactorizar hacia core/*_engine en Sprint 1,
# no se acumula deuda de tipado retroactivo sobre código que se va a mover.
module = "app.routes.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
omit = ["app/services/*", "*/alembic/*"]

[tool.coverage.report]
# Sprint 0: umbral de arranque, deliberadamente bajo -- sube por fase segun
# el Engineering Handbook (Core domain 90% / Supporting 80% / Generic 70%)
# a medida que cada contexto se refactoriza hacia core/*.
fail_under = 20
show_missing = true
