services:
  migpal-db:
    image: postgres:16
    container_name: migpal-db
    environment:
      POSTGRES_DB: migpal
      POSTGRES_USER: migpal
      POSTGRES_PASSWORD: migpal
    ports:
      - "54331:5432"
    volumes:
      - migpal_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  migpal_pgdata:
