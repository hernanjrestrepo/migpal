# =============================================================================
# MigPAL — overrides de producción
# -----------------------------------------------------------------------------
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Diferencias reales con desarrollo (no cosméticas):
#   - Postgres y Redis dejan de publicar puertos al host. En desarrollo se
#     exponen para poder hacer psql/redis-cli desde afuera; en producción eso
#     es superficie de ataque gratis.
#   - El backend tampoco publica puerto: solo nginx habla con él, por la red
#     interna de Docker.
#   - nginx entra como único punto de entrada (80/443) y sirve el frontend.
#   - Logs en JSON, con rotación.
#   - `restart: always` en vez de `unless-stopped`.
#
# Antes de levantar esto hay que tener un `.env` de producción real
# (ver .env.production.example y docs/DEPLOYMENT.md).
# =============================================================================

services:
  postgres:
    ports: !reset []     # sin exposición al host
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en produccion}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    ports: !reset []
    restart: always
    # Sin password, Redis solo es alcanzable dentro de la red de Docker.
    # Si algún día se expone, hay que agregar `--requirepass`.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    ports: !reset []     # solo accesible vía nginx
    restart: always
    environment:
      - environment=production
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # En producción NO se agregan los orígenes de desarrollo (ver main.py).
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS es obligatorio en produccion}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  frontend:
    # En producción el frontend no se sirve solo: nginx monta sus archivos.
    ports: !reset []
    restart: always

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"    # descomentar junto con el bloque TLS de nginx.conf
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
      # - ./deploy/certbot/conf:/etc/letsencrypt:ro
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
