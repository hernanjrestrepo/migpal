name: CI

# Sprint 0 (Foundation). Reemplaza el pipeline anterior, que referenciaba
# ./migpal/backend (una ruta que no existe en este repo) y tenia `|| true` /
# `continue-on-error: true` en casi todos los pasos -- reportaba verde sin
# importar si algo fallaba. Este workflow falla de verdad cuando algo falla.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sintaxis (todo el árbol)
        run: python -c "import ast,glob; [ast.parse(open(f, encoding='utf-8').read()) for f in glob.glob('app/**/*.py', recursive=True)]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (formato)
        run: black --check .

      - name: MyPy (tipos)
        # No bloqueante todavía: app/services/* es código heredado sin tipado
        # (ver pyproject.toml). Se vuelve estricto módulo por módulo a medida
        # que Sprint 1 lo refactoriza hacia core/*.
        run: mypy app --explicit-package-bases

  test:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migpal
          POSTGRES_PASSWORD: migpal_test
          POSTGRES_DB: migpal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migpal -d migpal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET_KEY: ci-test-secret-key-not-for-production-use
      DATABASE_URL: postgresql://migpal:migpal_test@localhost:5432/migpal_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones (Postgres real, no simulado)
        run: alembic upgrade head

      - name: Ejecutar tests con cobertura
        run: pytest

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen backend
        run: docker build -t migpal-backend:${{ github.sha }} ./backend
      - name: Construir imagen frontend
        run: docker build -t migpal-frontend:${{ github.sha }} ./frontend
