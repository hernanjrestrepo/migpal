<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MigPAL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">MigPAL</div>
                <nav>
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="assessment.html">Diagnóstico</a></li>
                        <li><a href="routes.html">Rutas Legales</a></li>
                        <li><a href="ai-assistant.html">Asistente IA</a></li>
                        <li><a href="services.html">Servicios</a></li>
                        <li><a href="documents.html">Documentos</a></li>
                    </ul>
                </nav>
                <div id="user-info"></div>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="dashboard-header">
            <h1>Mi Proceso Migratorio</h1>
            <p>Bienvenido a tu panel de control</p>
        </div>
        
        <div id="stats-container" class="grid grid-3">
            <!-- Stats will be loaded here -->
        </div>
        
        <div class="grid grid-2 mt-4">
            <div class="card">
                <div class="card-header">Mi Proceso Actual</div>
                <div id="current-process">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">Próximos Pasos</div>
                <div id="next-steps">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">Documentos Pendientes</div>
            <div id="pending-documents">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">Servicios Recomendados</div>
            <div id="recommended-services">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </main>
    
    <script src="js/app.js"></script>
    <script>
        requireAuth();
        initUserInfo();
        
        async function loadDashboard() {
            try {
                // Load user info
                const user = await authAPI.getCurrentUser();
                
                // Try to load migration profile
                let profile = null;
                let migrationProcess = null;
                
                try {
                    const profileResponse = await fetch(`${API_BASE_URL}/assessment/my-profile`, {
                        headers: {
                            'Authorization': `Bearer ${auth.getToken()}`
                        }
                    });
                    
                    if (profileResponse.ok) {
                        profile = await profileResponse.json();
                        
                        // Try to load selected process
                        const processResponse = await fetch(`${API_BASE_URL}/migration/my-process`, {
                            headers: {
                                'Authorization': `Bearer ${auth.getToken()}`
                            }
                        });
                        
                        if (processResponse.ok) {
                            const processData = await processResponse.json();
                            migrationProcess = processData.process;
                        }
                    }
                } catch (error) {
                    console.log('No migration profile yet');
                }
                
                // Display stats
                const statsContainer = document.getElementById('stats-container');
                
                if (profile) {
                    const progressPercentage = calculateProgress(profile.current_stage);
                    
                    statsContainer.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #EEF2FF; color: #4F46E5;">📊</div>
                            <div class="stat-label">Progreso</div>
                            <div class="stat-value">${progressPercentage}%</div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #D1FAE5; color: #10B981;">🎯</div>
                            <div class="stat-label">Etapa Actual</div>
                            <div class="stat-value">${getStageLabel(profile.current_stage)}</div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #FEF3C7; color: #F59E0B;">🌍</div>
                            <div class="stat-label">Destino</div>
                            <div class="stat-value">${profile.target_country}</div>
                        </div>
                    `;
                } else {
                    statsContainer.innerHTML = `
                        <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
                            <h3>¡Bienvenido a MigPAL!</h3>
                            <p>Comienza completando tu diagnóstico migratorio</p>
                            <a href="assessment.html" class="btn btn-primary mt-2">Iniciar Diagnóstico</a>
                        </div>
                    `;
                }
                
                // Display current process
                const currentProcessContainer = document.getElementById('current-process');
                if (migrationProcess) {
                    currentProcessContainer.innerHTML = `
                        <div style="padding: 1rem;">
                            <h3>${migrationProcess.name}</h3>
                            <p style="margin: 0.5rem 0;">${migrationProcess.description}</p>
                            <div style="margin-top: 1rem;">
                                <strong>Tiempo estimado:</strong> ${migrationProcess.estimated_time_months} meses<br>
                                <strong>Costo estimado:</strong> $${migrationProcess.estimated_cost_min} - $${migrationProcess.estimated_cost_max} USD
                            </div>
                            <a href="routes.html" class="btn btn-sm btn-primary mt-2">Ver Detalles</a>
                        </div>
                    `;
                } else {
                    currentProcessContainer.innerHTML = `
                        <p class="text-center p-2">No has seleccionado un proceso migratorio aún</p>
                        <div class="text-center">
                            <a href="routes.html" class="btn btn-sm btn-primary">Explorar Rutas</a>
                        </div>
                    `;
                }
                
                // Display next steps
                const nextStepsContainer = document.getElementById('next-steps');
                const nextSteps = getNextSteps(profile?.current_stage || 'assessment');
                nextStepsContainer.innerHTML = `
                    <ul style="padding: 1rem; list-style: none;">
                        ${nextSteps.map(step => `<li style="padding: 0.5rem 0;">✓ ${step}</li>`).join('')}
                    </ul>
                `;
                
                // Load documents
                loadPendingDocuments();
                
                // Load recommended services
                loadRecommendedServices(profile);
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('stats-container').innerHTML = 
                    `<div class="alert alert-error">Error al cargar el dashboard: ${error.message}</div>`;
            }
        }
        
        function calculateProgress(stage) {
            const stages = {
                'assessment': 20,
                'preparation': 40,
                'application': 60,
                'waiting': 80,
                'approved': 100,
                'rejected': 0
            };
            return stages[stage] || 0;
        }
        
        function getStageLabel(stage) {
            const labels = {
                'assessment': 'Diagnóstico',
                'preparation': 'Preparación',
                'application': 'Aplicación',
                'waiting': 'En Espera',
                'approved': 'Aprobado',
                'rejected': 'Rechazado'
            };
            return labels[stage] || stage;
        }
        
        function getNextSteps(stage) {
            const steps = {
                'assessment': [
                    'Completa tu perfil migratorio',
                    'Explora rutas legales disponibles',
                    'Consulta con el asistente IA'
                ],
                'preparation': [
                    'Reúne documentos requeridos',
                    'Contacta con abogados recomendados',
                    'Prepara presupuesto'
                ],
                'application': [
                    'Completa formularios',
                    'Sube documentos',
                    'Paga tasas requeridas'
                ],
                'waiting': [
                    'Monitorea el estado',
                    'Responde a solicitudes adicionales',
                    'Prepara entrevista si aplica'
                ],
                'approved': [
                    'Planifica tu mudanza',
                    'Busca vivienda',
                    'Explora oportunidades de empleo'
                ]
            };
            return steps[stage] || ['Completa tu diagnóstico para ver próximos pasos'];
        }
        
        async function loadPendingDocuments() {
            const container = document.getElementById('pending-documents');
            try {
                const response = await fetch(`${API_BASE_URL}/documents`, {
                    headers: {
                        'Authorization': `Bearer ${auth.getToken()}`
                    }
                });
                
                if (response.ok) {
                    const documents = await response.json();
                    const pending = documents.filter(d => d.status === 'pending');
                    
                    if (pending.length === 0) {
                        container.innerHTML = '<p class="text-center p-2">No hay documentos pendientes</p>';
                    } else {
                        container.innerHTML = `
                            <ul style="padding: 1rem; list-style: none;">
                                ${pending.map(doc => `
                                    <li style="padding: 0.5rem 0;">📄 ${doc.name} - ${doc.type}</li>
                                `).join('')}
                            </ul>
                            <div class="text-center">
                                <a href="documents.html" class="btn btn-sm btn-primary">Ver Todos</a>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = '<p class="text-center p-2">No se pudieron cargar los documentos</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-center p-2">Error al cargar documentos</p>';
            }
        }
        
        async function loadRecommendedServices(profile) {
            const container = document.getElementById('recommended-services');
            
            if (!profile) {
                container.innerHTML = '<p class="text-center p-2">Completa tu perfil para ver servicios recomendados</p>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/services/?country=${profile.target_country}&verified_only=true`, {
                    headers: {
                        'Authorization': `Bearer ${auth.getToken()}`
                    }
                });
                
                if (response.ok) {
                    const services = await response.json();
                    
                    if (services.length === 0) {
                        container.innerHTML = '<p class="text-center p-2">No hay servicios disponibles aún</p>';
                    } else {
                        container.innerHTML = `
                            <div style="padding: 1rem;">
                                ${services.slice(0, 3).map(service => `
                                    <div style="padding: 0.5rem 0; border-bottom: 1px solid var(--gray-200);">
                                        <strong>${service.name}</strong> - ${service.type}<br>
                                        <small>${service.city}, ${service.country}</small>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="text-center">
                                <a href="services.html" class="btn btn-sm btn-primary">Ver Todos</a>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = '<p class="text-center p-2">No se pudieron cargar los servicios</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-center p-2">Error al cargar servicios</p>';
            }
        }
        
        loadDashboard();
    </script>
</body>
</html>
