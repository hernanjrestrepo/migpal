<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MigPAL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>MigPAL</h1>
                <p>Crea tu cuenta y comienza tu proceso migratorio</p>
            </div>
            
            <div id="message"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Nombre de Usuario *</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <small>Mínimo 6 caracteres</small>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Crear Cuenta</button>
            </form>
            
            <p class="text-center mt-3">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        if (auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            const messageDiv = document.getElementById('message');
            
            try {
                messageDiv.innerHTML = '<div class="alert alert-info">Creando cuenta...</div>';
                
                await authAPI.register(formData);
                
                messageDiv.innerHTML = '<div class="alert alert-success">¡Cuenta creada! Iniciando sesión...</div>';
                
                // Auto-login after registration
                const loginData = await authAPI.login(formData.username, formData.password);
                auth.setToken(loginData.access_token);
                
                setTimeout(() => {
                    window.location.href = 'assessment.html';
                }, 1000);
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
