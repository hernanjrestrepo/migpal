# Prometheus Configuration for MIGPAL
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'migpal'
    environment: 'production'

scrape_configs:
  - job_name: 'migpal-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'migpal-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
