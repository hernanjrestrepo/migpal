# =============================================================================
# MigPAL — nginx de producción
# -----------------------------------------------------------------------------
# Sirve el frontend estático y hace de reverse proxy hacia el backend en el
# MISMO origen. Eso es lo que permite que `assets/app.js` resuelva la API con
# `window.location.origin` sin configuración extra (ver resolveApiBase): en
# producción no hay CORS entre frontend y API porque no hay cruce de origen.
#
# TLS: este archivo asume que la terminación TLS la hace algo delante
# (Cloudflare, un balanceador, o certbot sobre este mismo nginx). El bloque
# de HTTPS está al final, comentado, con lo mínimo para activarlo.
# =============================================================================

upstream migpal_backend {
    server backend:8000;
    keepalive 32;
}

# Zonas de rate limit a nivel de borde. Es una segunda capa: el backend ya
# limita login/registro por su cuenta (app/middleware.py). Acá se frena el
# volumen antes de que llegue a Python.
limit_req_zone $binary_remote_addr zone=migpal_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=migpal_auth:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    # Tamaño máximo de cuerpo: hoy el API solo recibe JSON de texto.
    client_max_body_size 1m;

    # --- Cabeceras de seguridad de la página ---
    # La CSP se define acá y no en el backend: es política del documento que
    # se sirve, no de las respuestas JSON.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ------------------------------------------------------------------ API
    # Prefijos que pertenecen al backend. Cualquier ruta nueva de un bounded
    # context nuevo tiene que sumarse acá.
    location ~ ^/(v1|api|health|ready|docs|redoc|openapi\.json) {
        limit_req zone=migpal_api burst=40 nodelay;

        proxy_pass http://migpal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # El middleware del backend lee el primer valor de esta cabecera
        # para el rate limit por IP -- si el proxy no la manda, todos los
        # clientes se ven como una sola IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    75s;
        # El LLM puede tardar: el cliente espera hasta 60s (LLM_TIMEOUT_SECONDS)
        # más el reintento. 75s deja margen sin colgar la conexión para siempre.
        proxy_read_timeout    75s;
    }

    # Login y registro con un cupo más estricto en el borde.
    location = /api/v1/auth/token {
        limit_req zone=migpal_auth burst=5 nodelay;
        proxy_pass http://migpal_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- frontend
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash de contenido en el nombre solo cuando exista un
    # build step. Mientras se sirvan con nombre fijo, cache corta + revalidación
    # evita que un usuario quede con CSS viejo tras un despliegue.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Errores del backend no deben filtrar su cuerpo crudo al usuario.
    proxy_intercept_errors off;
}

